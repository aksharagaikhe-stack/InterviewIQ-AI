<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | InterviewIQ AI</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<header class="auth-header">
    <div class="auth-header-content">
        <h1>InterviewIQ AI</h1>
        <p>AI-Powered Interview Preparation</p>
    </div>
</header>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-title">
            <h2>Create Your Account</h2>
            <p>Start practicing smarter with AI-powered mock interviews.</p>
        </div>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="education">Education</label>
                <input
                    type="text"
                    id="education"
                    placeholder="e.g. Computer Engineering"
                >
            </div>

            <div class="form-group">
                <label for="skills">Skills</label>
                <input
                    type="text"
                    id="skills"
                    placeholder="e.g. Python, C++, Java"
                >
            </div>

            <p id="signupStatus" class="auth-status"></p>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</main>

<script src="js/config.js"></script>
<script src="js/signup.js"></script>

</body>
</html>
