<title>Interview Setup | InterviewIQ AI</title>

<link rel="stylesheet" href="css/style.css">

<style>
    body {
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
    }

    .selection-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background:
            radial-gradient(
                circle at 20% 20%,
                #e0e7ff,
                transparent 35%
            ),
            #f8fafc;
    }

    .selection-card {
        width: 100%;
        max-width: 650px;
        padding: 40px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
    }

    .selection-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .selection-header h1 {
        margin-bottom: 10px;
        font-size: 32px;
        color: #111827;
    }

    .selection-header p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 15px;
        border-radius: 9px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #111827;
        font-size: 15px;
        outline: none;
        transition: 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .form-group select option {
        background: #ffffff;
        color: #111827;
    }

    .selection-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .category-group,
    .language-group {
        display: none;
    }

    .category-group.show,
    .language-group.show {
        display: block;
    }

    .selection-note {
        display: block;
        margin-top: 7px;
        color: #64748b;
        font-size: 13px;
    }

    #statusMessage {
        min-height: 22px;
        margin: 10px 0 18px;
        text-align: center;
        font-size: 14px;
    }

    .success-message {
        color: #16a34a;
    }

    .error-message {
        color: #dc2626;
    }

    .primary-btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 9px;
        background: #6366f1;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    .primary-btn:hover {
        background: #4f46e5;
        transform: translateY(-2px);
    }

    .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .back-home {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: #64748b;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .back-home:hover {
        color: #6366f1;
    }

    @media (max-width: 600px) {
        .selection-card {
            padding: 25px 20px;
        }

        .selection-header h1 {
            font-size: 26px;
        }

        .selection-row {
            grid-template-columns: 1fr;
            gap: 0;
        }
    }
</style>

</head>

<body>

<div class="selection-container">

    <div class="selection-card">

        <div class="selection-header">
            <h1>Set Up Your Interview</h1>

            <p>
                Choose your interview preferences and let
                InterviewIQ AI create a personalized mock interview.

        </div>

        <form id="interviewSelectionForm">

            <!-- INTERVIEW TYPE -->

                    </option>

                        HR Interview

                        Mixed Interview

            <!-- CATEGORY -->
            <div class="form-group category-group" id="categoryGroup">

                <label for="category">
                    Interview Category
                </label>

                <select id="category">

                    <option value="">
                        Select Category
                    </option>

                </select>

                <span class="selection-note">

                </span>

            </div>


            <!-- ROLE -->
            <div class="form-group">

                    <option value="">

                    <option value="Software Developer">

                    <option value="Python Developer">
                        Python Developer
                    </option>

                    <option value="Java Developer">
                        Java Developer
                    </option>

                    <option value="C++ Developer">

                    <option value="Data Analyst">

                        AI/ML Engineer

</div>


<!-- JAVASCRIPT -->
<script src="js/config.js"></script>
<script src="js/interview-selection.js"></script>


<!-- CATEGORY + LANGUAGE LOGIC -->
<script>

    document.addEventListener("DOMContentLoaded", function () {

        const interviewType =
            document.getElementById("interviewType");

        const categoryGroup =
            document.getElementById("categoryGroup");

        const category =
            document.getElementById("category");

        const languageGroup =
            document.getElementById("languageGroup");

        const language =
            document.getElementById("language");


        const technicalCategories = [
            "Python",
            "C",
            "C++",
            "Java",
            "OOP",
            "DSA"
        ];


        function updateFields() {

            const type = interviewType.value;

            /* Clear old options */
            category.innerHTML =
                '<option value="">Select Category</option>';

            /*
             * TECHNICAL
             */
            if (type === "technical") {

                categoryGroup.classList.add("show");

                technicalCategories.forEach(function (item) {

                    const option =
                        document.createElement("option");

                    option.value = item;
                    option.textContent = item;

                    category.appendChild(option);

                });

                category.required = true;

            }

            /*
             * HR
             */
            else if (type === "hr") {

                categoryGroup.classList.add("show");

                const option =
                    document.createElement("option");

                option.value = "Behavioral";
                option.textContent = "Behavioral";

                category.appendChild(option);

                category.value = "Behavioral";
                category.required = true;

            }

            /*
             * CODING
             */
            else if (type === "coding") {

                categoryGroup.classList.remove("show");

                category.required = false;

                const option =
                    document.createElement("option");

                option.value = "Programming";
                option.textContent = "Programming";

                category.appendChild(option);

                category.value = "Programming";

            }

            /*
             * MIXED
             */
            else if (type === "mixed") {

                categoryGroup.classList.remove("show");

                category.required = false;

                const option =
                    document.createElement("option");

                option.value = "Mixed";
                option.textContent = "Mixed";

                category.appendChild(option);

                category.value = "Mixed";

            }

            /*
             * NOTHING SELECTED
             */
            else {

                categoryGroup.classList.remove("show");

                category.required = false;

            }


            /*
             * PROGRAMMING LANGUAGE
             *
             * Required only for Coding and Mixed.
             */
            if (
                type === "coding" ||
                type === "mixed"
            ) {

                languageGroup.classList.add("show");

                language.required = true;

            }

            else {

                languageGroup.classList.remove("show");

                language.required = false;

                language.value = "";

            }

        }


        interviewType.addEventListener(
            "change",
            updateFields
        );


        updateFields();

    });

</script>
